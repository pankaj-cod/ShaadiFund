name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:3100
  DATABASE_URL: postgresql://vowfund:vowfund@localhost:5432/vowfund
  # CI never uses real or test provider credentials.
  PAYMENTS_MODE: mock
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real-0123456789
  EMAIL_TRANSPORT: file

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vowfund
          POSTGRES_PASSWORD: vowfund
          POSTGRES_DB: vowfund
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vowfund -d vowfund"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
